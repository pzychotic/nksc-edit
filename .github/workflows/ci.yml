name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    paths-ignore:
      - '**.md'

jobs:
  build:
    name: Build
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Build Release
      run: msbuild nksc-edit.slnx -m -p:Configuration=Release -p:Platform=x64

    - name: Test
      run: ./build/x64/Release/nksc-edit-tests.exe tests/data
